[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# 所有测试共用同一个事件循环：engine 是模块级连接池，
# 若每个测试换循环，池里的连接会属于已关闭的循环（asyncpg 会报
# "attached to a different loop" / Connection._cancel was never awaited）
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
markers =
    integration: 需要真实外部依赖（如 PostgreSQL / 大模型），缺失时应 skip 而不是 fail
