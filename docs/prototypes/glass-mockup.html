<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>玻璃拟态效果图 · 1600×1000</title>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://cdn.jsdelivr.net/npm/@fontsource-variable/outfit@5.1.0/index.css" />
<style>
  :root{
    --display:"Outfit","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --body:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --indigo:#4F46E5;
    --violet:#8B5CF6;
    --orchid:#C084FC;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0E0C24}
  body{display:grid;place-items:center;min-height:100vh;padding:40px;font-family:var(--body)}

  /* ============ 画布 1600×1000 ============ */
  .scene{
    position:relative;width:1600px;height:1000px;border-radius:40px;overflow:hidden;
    box-shadow:0 60px 120px -40px rgba(5,4,20,.7);
    isolation:isolate;
  }

  /* ============ 背景：1-2 种主色 + 大块柔和自然形态 ============ */
  .bg{
    position:absolute;inset:-10%;
    background:
      radial-gradient(1200px 900px at 12% 88%, #2A2478 0%, rgba(42,36,120,0) 62%),
      radial-gradient(1100px 820px at 88% 8%, #7C4DFF 0%, rgba(124,77,255,0) 60%),
      radial-gradient(900px 760px at 58% 46%, #4F46E5 0%, rgba(79,70,229,0) 66%),
      linear-gradient(142deg, #1B1740 0%, #3B2A86 48%, #241E5C 100%);
  }
  /* 大块「云/水」形态：模糊半径远大于玻璃界面 */
  .form{position:absolute;border-radius:50%;filter:blur(120px);mix-blend-mode:screen;pointer-events:none}
  .f1{width:1100px;height:520px;left:-160px;top:120px;background:rgba(129,140,248,.42);transform:rotate(-12deg)}
  .f2{width:980px;height:460px;right:-180px;top:-90px;background:rgba(192,132,252,.38);transform:rotate(9deg)}
  .f3{width:1200px;height:560px;left:180px;bottom:-220px;background:rgba(96,165,250,.26);transform:rotate(-6deg)}
  .f4{width:760px;height:380px;left:46%;top:56%;background:rgba(232,121,249,.28);transform:rotate(14deg)}

  /* 文字区域下方压暗，保证可读、不刺眼 */
  .shade{
    position:absolute;inset:0;
    background:
      radial-gradient(760px 520px at 30% 62%, rgba(10,8,38,.48) 0%, rgba(10,8,38,0) 72%),
      radial-gradient(620px 460px at 76% 34%, rgba(10,8,38,.30) 0%, rgba(10,8,38,0) 70%),
      linear-gradient(180deg, rgba(10,8,38,.18), rgba(10,8,38,0) 30%, rgba(10,8,38,.26));
  }

  /* ============ 玻璃 ============ */
  .glass{
    position:relative;
    background:rgba(255,255,255,.10);            /* 10% 纯白底 */
    border:1px solid rgba(255,255,255,.55);      /* 1px 高亮白边 */
    backdrop-filter:blur(58px) saturate(215%) brightness(1.05);
    -webkit-backdrop-filter:blur(58px) saturate(215%) brightness(1.05);
    box-shadow:
      0 60px 120px -50px rgba(6,5,24,.75),
      0 2px 8px rgba(6,5,24,.30),
      inset 0 1px 0 rgba(255,255,255,.70),       /* 顶边高光：物理厚度 */
      inset 0 -1px 0 rgba(196,181,253,.26),      /* 底边折色 */
      inset 0 0 70px rgba(255,255,255,.09),      /* 内发光 */
      inset 0 0 0 1px rgba(255,255,255,.16);
  }
  /* 边缘折射：极细的色散光边，模拟液态玻璃的光线弯折 */
  .glass::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.75),
      inset 1.5px 1.5px 0 rgba(255,255,255,.28),
      inset -1.5px -1.5px 0 rgba(178,160,255,.28),
      inset 0 -1px 0 rgba(140,120,240,.22);
    mix-blend-mode:screen;
  }
  /* 顶部一层漫射高光（玻璃表面的反光带） */
  .glass::before{
    content:"";position:absolute;left:0;right:0;top:0;height:46%;border-radius:36px 36px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
    pointer-events:none;
  }

  /* ============ 主面板 ============ */
  .panel{
    position:absolute;left:120px;top:96px;width:1360px;height:808px;border-radius:36px;
    padding:38px 46px 40px;display:flex;flex-direction:column;
  }

  /* nav */
  .nav{display:flex;align-items:center;gap:34px;position:relative;z-index:2}
  .brand{display:flex;align-items:center;gap:11px;color:#fff}
  .mark{
    width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366F1,#C084FC);
    font-family:var(--display);font-size:15px;font-weight:600;
    box-shadow:0 10px 22px -8px rgba(124,58,237,.8), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .brand b{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.02em}
  .brand small{display:block;font-size:9.5px;letter-spacing:.22em;color:rgba(255,255,255,.55);text-transform:uppercase;font-weight:500}
  .links{display:flex;gap:26px;margin-left:22px}
  .links a{color:rgba(255,255,255,.62);text-decoration:none;font-size:13.5px;font-weight:500}
  .links a.on{color:#fff}
  .nav .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{
    display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
    color:rgba(255,255,255,.72);font-size:12.5px;font-weight:500;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(10px);
  }
  .pill svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
  .avatar{
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#818CF8,#E879F9);color:#fff;font-family:var(--display);
    font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,.35);
  }

  /* hero */
  .hero{display:grid;grid-template-columns:1fr 420px;gap:56px;align-items:center;margin-top:58px;position:relative;z-index:2}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#E8E4FF;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(8px);
  }
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#818CF8,#E879F9)}
  h1{
    font-family:var(--display);font-size:64px;line-height:1.04;letter-spacing:-.025em;
    font-weight:600;color:#fff;margin:22px 0 0;
    text-shadow:0 2px 24px rgba(10,8,40,.35);
  }
  h1 em{font-style:normal;background:linear-gradient(120deg,#C084FC,#F472B6 52%,#67E8F9);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:20px 0 0;font-size:15.5px;line-height:1.8;color:rgba(255,255,255,.62);max-width:52ch}
  .cta{display:flex;gap:12px;margin-top:34px}
  .btn{
    display:inline-flex;align-items:center;gap:9px;padding:15px 26px;border-radius:14px;
    font-size:14px;font-weight:600;text-decoration:none;transition:.2s;
  }
  .btn.primary{
    color:#1A1440;background:linear-gradient(135deg,#E9E5FF,#C7BEFF);
    box-shadow:0 18px 40px -18px rgba(196,181,253,.9), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .btn.ghost{
    color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(12px);
  }
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .metrics{display:flex;gap:12px;margin-top:36px}
  .metric{
    flex:1;padding:16px 18px;border-radius:16px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.20);
    backdrop-filter:blur(12px);
  }
  .metric .k{font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.5);font-weight:500}
  .metric .v{font-family:var(--display);font-size:28px;font-weight:600;color:#fff;margin-top:8px;letter-spacing:-.02em}
  .metric .v small{font-size:11px;color:rgba(255,255,255,.5);margin-left:4px;font-weight:500}

  /* focus card */
  .focus{
    border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:22px;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(30px) saturate(170%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 24px 50px -30px rgba(6,5,24,.6);
  }
  .focus .top{display:flex;align-items:center;justify-content:space-between}
  .focus .top span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
  .focus .top b{font-size:11px;color:rgba(255,255,255,.42);font-weight:500}
  .ringrow{display:flex;align-items:center;gap:24px}
  .ring{position:relative;width:132px;height:132px;flex:none}
  .ring svg{width:132px;height:132px;transform:rotate(-90deg);
    filter:drop-shadow(0 10px 28px rgba(192,38,211,.50))}
  .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .ctr b{font-family:var(--display);font-size:32px;font-weight:600;color:#fff;line-height:1;letter-spacing:-.02em}
  .ring .ctr span{font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.5);margin-top:6px;font-weight:600}
  .focus .txt{font-size:13.5px;line-height:1.8;color:rgba(255,255,255,.66)}
  .focus .txt b{color:#fff;font-weight:600}
  .divider{height:1px;background:linear-gradient(90deg, rgba(255,255,255,.24), rgba(255,255,255,.04))}
  .focus .row{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.6)}
  .focus .row b{color:#fff;font-family:var(--display);font-weight:600}

  /* 迷你趋势图：让图表的颜色在效果图里出现 */
  .minichart{margin-top:2px}
  .mc-head{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600}
  .mc-head b{color:#fff;font-family:var(--display);letter-spacing:0;font-weight:600;font-size:12px}
  .minichart svg{width:100%;height:70px;display:block;overflow:visible;margin-top:4px}

  /* 底部细条 */
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
    padding-top:26px;border-top:1px solid rgba(255,255,255,.14);position:relative;z-index:2}
  .foot .l{display:flex;gap:26px;font-size:11.5px;color:rgba(255,255,255,.45)}
  .foot .l b{color:rgba(255,255,255,.8);font-weight:600}
  .foot .r{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.32)}
</style>
</head>
<body>
<div class="scene">
  <div class="bg"></div>
  <div class="form f1"></div><div class="form f2"></div><div class="form f3"></div><div class="form f4"></div>
  <div class="shade"></div>

  <main class="glass panel">
    <header class="nav">
      <div class="brand">
        <div class="mark">学</div>
        <div><b>靛光</b><small>Study</small></div>
      </div>
      <nav class="links">
        <a href="#" class="on">工作台</a>
        <a href="#">学习资料</a>
        <a href="#">在线笔记</a>
        <a href="#">学习计划</a>
        <a href="#">AI 助手</a>
        <a href="#">学习统计</a>
      </nav>
      <div class="right">
        <span class="pill">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          搜索
        </span>
        <div class="avatar">E</div>
      </div>
    </header>

    <section class="hero">
      <div>
        <span class="eyebrow"><i></i>2026 · 10 · 20 · 周二</span>
        <h1>早上好，<em>Echo</em>。<br/>今天只做一件事。</h1>
        <p class="sub">昨天你完成了第一章的测验，正确率 60%。今天适合先把那道错题补完，再开始新的章节。</p>
        <div class="cta">
          <a class="btn primary" href="#">开始专注
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <a class="btn ghost" href="#">查看学习统计</a>
        </div>
        <div class="metrics">
          <div class="metric"><div class="k">近 7 天</div><div class="v">60<small>分钟</small></div></div>
          <div class="metric"><div class="k">任务完成率</div><div class="v">100<small>%</small></div></div>
          <div class="metric"><div class="k">答题正确率</div><div class="v">60<small>%</small></div></div>
        </div>
      </div>

      <aside class="focus">
        <div class="top"><span>今日专注</span><b>目标 60 min</b></div>
        <div class="ringrow">
          <div class="ring">
            <svg viewBox="0 0 132 132">
              <defs>
                <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#67E8F9"/><stop offset="48%" stop-color="#A855F7"/><stop offset="100%" stop-color="#F472B6"/>
                </linearGradient>
              </defs>
              <circle cx="66" cy="66" r="56" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/>
              <circle cx="66" cy="66" r="56" fill="none" stroke="url(#rg)" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="351.9" stroke-dashoffset="105.6"/>
            </svg>
            <div class="ctr"><b>70%</b><span>今日目标</span></div>
          </div>
          <div class="txt">已学 <b>42 分钟</b><br/>再 <b>18 分钟</b> 完成今天的量</div>
        </div>
        <div class="divider"></div>
        <div class="row"><span>连续学习</span><b>1 天</b></div>
        <div class="row"><span>本周学习</span><b>60 分钟</b></div>

        <div class="minichart">
          <div class="mc-head"><span>近 7 天</span><b>峰值 60 min</b></div>
          <svg viewBox="0 0 340 64" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="mcArea" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="rgba(192,38,211,.55)"/>
                <stop offset="1" stop-color="rgba(99,102,241,0)"/>
              </linearGradient>
              <linearGradient id="mcLine" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#67E8F9"/><stop offset="52%" stop-color="#A855F7"/><stop offset="1" stop-color="#F472B6"/>
              </linearGradient>
            </defs>
            <path d="M2,58 L50,58 L98,58 L146,58 L194,58 L242,56 L290,10 L338,10 L338,62 L2,62 Z" fill="url(#mcArea)"/>
            <path d="M2,58 L50,58 L98,58 L146,58 L194,58 L242,56 L290,10 L338,10"
              fill="none" stroke="url(#mcLine)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"
              style="filter:drop-shadow(0 3px 8px rgba(192,38,211,.45))"/>
            <circle cx="338" cy="10" r="3.8" fill="#F472B6" stroke="#fff" stroke-width="1.8"/>
          </svg>
        </div>
      </aside>
    </section>

    <footer class="foot">
      <div class="l">
        <span>资料 <b>2</b> 份</span>
        <span>笔记 <b>2</b> 条</span>
        <span>AI 调用 <b>8</b> 次</span>
      </div>
      <div class="r">Liquid Glass · Mockup</div>
    </footer>
  </main>
</div>
</body>
</html>
