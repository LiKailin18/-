# 一键起全套：PostgreSQL + 后端 + 前端（nginx 反代）
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   打开 http://127.0.0.1:8080  （后端 http://127.0.0.1:8000，/health 看状态）
#
# 敏感项从 deploy/.env 读（不入库）：LLM_API_KEY / SECRET_KEY 等，见 deploy/.env.example
#
# 注意：PostgreSQL 18 起官方镜像的数据目录布局变了，必须挂 /var/lib/postgresql
# 而不是旧版的 /var/lib/postgresql/data（挂旧的会报
# "there appears to be PostgreSQL data in: /var/lib/postgresql/data" 并拒绝启动）。
# 参考：docker-library/postgres PR #1259
services:
  postgres:
    image: postgres:18-alpine
    container_name: sls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: smart_learning
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      # 仅本机可访问；生产不再对宿主机暴露（CLAUDE.md §8）
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d smart_learning"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    container_name: sls-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/smart_learning
      APP_ENV: prod
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      # 不设 Key 也能起，只是 AI 接口返回 503（SYS_503）；部署时在 deploy/.env 里填
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - uploads:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build: ../frontend
    container_name: sls-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  uploads:
